global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]

  # periscope eBPF tool exporters (P-001). These are long-lived host processes
  # started manually (e.g. `biolat --exporter :9601`); they are down unless the
  # corresponding exporter is running.
  - job_name: "biolat"
    static_configs:
      - targets: ["localhost:9601"]
  - job_name: "runqlat"
    static_configs:
      - targets: ["localhost:9602"]
  - job_name: "offcpu"
    static_configs:
      - targets: ["localhost:9603"]
